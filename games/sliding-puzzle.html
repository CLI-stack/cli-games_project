<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>15 Puzzle</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0a;
    color: #fff;
    font-family: 'Press Start 2P', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 10px;
    overflow-x: hidden;
  }
  #back-btn {
    position: fixed;
    top: 10px;
    left: 10px;
    color: #ff6b35;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    text-decoration: none;
    z-index: 100;
    background: rgba(10,10,10,0.8);
    padding: 6px 8px;
    border: 1px solid #ff6b35;
  }
  h1 {
    font-size: clamp(12px, 3.5vw, 20px);
    color: #ff3366;
    margin: 50px 0 12px;
    text-shadow: 0 0 10px #ff3366;
    letter-spacing: 3px;
  }
  #stats {
    display: flex;
    gap: 20px;
    margin-bottom: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .stat {
    font-size: clamp(8px, 2vw, 11px);
    color: #00e5ff;
    text-align: center;
  }
  .stat span {
    display: block;
    color: #fff;
    margin-top: 4px;
    font-size: clamp(10px, 2.5vw, 14px);
  }
  #grid-container {
    position: relative;
    touch-action: none;
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    background: #111;
    padding: 8px;
    border: 2px solid #ff3366;
    box-shadow: 0 0 20px #ff336644;
  }
  .tile {
    width: clamp(64px, 18vw, 88px);
    height: clamp(64px, 18vw, 88px);
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    border: 2px solid #00e5ff;
    box-shadow: 0 0 8px #00e5ff55, inset 0 0 8px #00e5ff11;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(14px, 4vw, 22px);
    font-family: 'Press Start 2P', monospace;
    color: #00e5ff;
    cursor: pointer;
    border-radius: 4px;
    transition: transform 0.12s ease, background 0.15s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .tile:active { transform: scale(0.93); }
  .tile.empty {
    background: #0a0a0a;
    border-color: #1a1a1a;
    box-shadow: none;
    cursor: default;
  }
  .tile.correct {
    border-color: #00ff88;
    box-shadow: 0 0 10px #00ff8855;
    color: #00ff88;
    background: linear-gradient(135deg, #001a0d, #003318);
  }
  .tile.sliding {
    transition: transform 0.15s ease;
  }
  #message {
    font-size: clamp(10px, 2.5vw, 14px);
    min-height: 30px;
    color: #00ff88;
    text-align: center;
    margin: 14px 10px;
    text-shadow: 0 0 8px #00ff88;
  }
  .btn {
    background: transparent;
    border: 2px solid #ff6b35;
    color: #ff6b35;
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(9px, 2.5vw, 12px);
    padding: 12px 20px;
    cursor: pointer;
    margin: 4px;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s;
  }
  .btn:active { background: #ff6b3522; }
  #buttons { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }
  @keyframes celebrate {
    0%,100% { text-shadow: 0 0 8px #00ff88; }
    50% { text-shadow: 0 0 30px #00ff88, 0 0 60px #00ff8888; }
  }
  #message.win { animation: celebrate 0.6s ease infinite; }
</style>
</head>
<body>
<a href="../index.html" id="back-btn">&#8592; BACK</a>
<h1>15 PUZZLE</h1>
<div id="stats">
  <div class="stat">MOVES<span id="move-count">0</span></div>
  <div class="stat">TIME<span id="timer">0:00</span></div>
</div>
<div id="grid-container">
  <div id="grid"></div>
</div>
<div id="message"></div>
<div id="buttons">
  <button class="btn" id="shuffle-btn">SHUFFLE</button>
  <button class="btn" id="solve-btn" style="border-color:#00e5ff;color:#00e5ff;">SOLVE</button>
</div>

<script>
let tiles = [];       // array of 16 values; index = position, value = number (0 = empty)
let emptyIndex = 15;  // position of empty tile
let moves = 0;
let seconds = 0;
let timerInterval = null;
let gameWon = false;
let animating = false;

const grid = document.getElementById('grid');
const moveCountEl = document.getElementById('move-count');
const timerEl = document.getElementById('timer');
const messageEl = document.getElementById('message');

function initSolved() {
  tiles = Array.from({length: 16}, (_, i) => i + 1);
  tiles[15] = 0;
  emptyIndex = 15;
}

function renderGrid() {
  grid.innerHTML = '';
  tiles.forEach((val, idx) => {
    const tile = document.createElement('div');
    tile.className = 'tile' + (val === 0 ? ' empty' : '');
    tile.dataset.index = idx;
    if (val !== 0) {
      tile.textContent = val;
      if (isInCorrectPlace(val, idx)) tile.classList.add('correct');
      tile.addEventListener('click', () => handleTileClick(idx));
      tile.addEventListener('touchstart', e => { e.preventDefault(); handleTileClick(idx); }, { passive: false });
    }
    grid.appendChild(tile);
  });
}

function isInCorrectPlace(val, idx) {
  return (val - 1) === idx;
}

function getNeighbors(idx) {
  const neighbors = [];
  const row = Math.floor(idx / 4);
  const col = idx % 4;
  if (row > 0) neighbors.push(idx - 4);
  if (row < 3) neighbors.push(idx + 4);
  if (col > 0) neighbors.push(idx - 1);
  if (col < 3) neighbors.push(idx + 1);
  return neighbors;
}

function handleTileClick(idx) {
  if (gameWon || animating) return;
  if (!getNeighbors(idx).includes(emptyIndex)) return;
  slideTile(idx);
}

function slideTile(idx, silent = false) {
  tiles[emptyIndex] = tiles[idx];
  tiles[idx] = 0;
  emptyIndex = idx;
  if (!silent) {
    moves++;
    moveCountEl.textContent = moves;
    if (moves === 1) startTimer();
  }
  renderGrid();
  if (!silent && checkWin()) {
    gameWon = true;
    stopTimer();
    messageEl.textContent = `YOU WIN! ${moves} moves in ${timerEl.textContent}`;
    messageEl.classList.add('win');
  }
}

function checkWin() {
  for (let i = 0; i < 15; i++) {
    if (tiles[i] !== i + 1) return false;
  }
  return tiles[15] === 0;
}

function shuffle() {
  stopTimer();
  initSolved();
  moves = 0;
  seconds = 0;
  gameWon = false;
  animating = false;
  moveCountEl.textContent = '0';
  timerEl.textContent = '0:00';
  messageEl.textContent = '';
  messageEl.classList.remove('win');

  // 200 random valid moves from solved state
  let lastEmpty = 15;
  for (let i = 0; i < 200; i++) {
    const neighbors = getNeighbors(emptyIndex);
    const randomNeighbor = neighbors[Math.floor(Math.random() * neighbors.length)];
    tiles[emptyIndex] = tiles[randomNeighbor];
    tiles[randomNeighbor] = 0;
    emptyIndex = randomNeighbor;
  }
  renderGrid();
}

function startTimer() {
  stopTimer();
  timerInterval = setInterval(() => {
    seconds++;
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    timerEl.textContent = `${m}:${s.toString().padStart(2, '0')}`;
  }, 1000);
}

function stopTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
}

// Animated solve using BFS (limited to small puzzles / demonstration)
// For real solve we do iterative deepening A* — but to keep it simple and not freeze browser,
// we'll animate a sequence of moves by solving with A*-lite
async function solveAnimated() {
  if (gameWon) return;
  stopTimer();
  messageEl.textContent = 'SOLVING...';

  const solution = aStarSolve(tiles.slice(), emptyIndex);
  if (!solution) {
    messageEl.textContent = 'Could not solve from this state.';
    return;
  }

  animating = true;
  for (const moveIdx of solution) {
    await new Promise(r => setTimeout(r, 120));
    slideTile(moveIdx, true);
    renderGrid();
  }
  animating = false;
  moves += solution.length;
  moveCountEl.textContent = moves;
  if (checkWin()) {
    gameWon = true;
    messageEl.textContent = `SOLVED! ${moves} total moves.`;
    messageEl.classList.add('win');
  }
}

// A* solver for 15-puzzle
function aStarSolve(startTiles, startEmpty) {
  const goal = [...Array(15).keys()].map(i => i + 1);
  goal.push(0);
  const goalStr = goal.join(',');
  const startStr = startTiles.join(',');
  if (startStr === goalStr) return [];

  function manhattan(tilesArr) {
    let h = 0;
    for (let i = 0; i < 16; i++) {
      const v = tilesArr[i];
      if (v === 0) continue;
      const goalPos = v - 1;
      h += Math.abs(Math.floor(i/4) - Math.floor(goalPos/4)) + Math.abs((i%4) - (goalPos%4));
    }
    return h;
  }

  const startH = manhattan(startTiles);
  // Priority queue via simple sorted array (for puzzles <=50 moves away)
  // State: {tiles, empty, g, h, path}
  const open = [{ tiles: startTiles, empty: startEmpty, g: 0, h: startH, path: [] }];
  const visited = new Set([startStr]);
  const MAX_NODES = 80000;
  let nodesExplored = 0;

  while (open.length > 0) {
    // Sort by f = g + h
    open.sort((a, b) => (a.g + a.h) - (b.g + b.h));
    const cur = open.shift();
    nodesExplored++;
    if (nodesExplored > MAX_NODES) return null;

    const curStr = cur.tiles.join(',');
    if (curStr === goalStr) return cur.path;

    const neighbors = getNeighbors(cur.empty);
    for (const nb of neighbors) {
      const newTiles = cur.tiles.slice();
      newTiles[cur.empty] = newTiles[nb];
      newTiles[nb] = 0;
      const key = newTiles.join(',');
      if (visited.has(key)) continue;
      visited.add(key);
      const h = manhattan(newTiles);
      open.push({ tiles: newTiles, empty: nb, g: cur.g + 1, h, path: [...cur.path, nb] });
    }
  }
  return null;
}

document.getElementById('shuffle-btn').addEventListener('click', shuffle);
document.getElementById('solve-btn').addEventListener('click', solveAnimated);

initSolved();
shuffle();
</script>
</body>
</html>
