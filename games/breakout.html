<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>BREAKOUT</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.15) 2px,rgba(0,0,0,0.15) 4px);
      pointer-events: none;
      z-index: 100;
    }

    .back-btn {
      position: fixed;
      top: 12px;
      left: 12px;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.5rem;
      color: #00e5ff;
      text-decoration: none;
      background: rgba(0,229,255,0.1);
      border: 1px solid #00e5ff;
      padding: 8px 12px;
      border-radius: 4px;
      z-index: 200;
    }
    .back-btn:hover { background: rgba(0,229,255,0.25); }

    h1 {
      font-size: clamp(1rem, 4vw, 1.6rem);
      color: #ff3366;
      text-shadow: 0 0 10px #ff3366, 0 0 20px #ff3366;
      margin: 70px 0 12px;
      letter-spacing: 0.2em;
    }

    .hud {
      display: flex;
      gap: 24px;
      margin-bottom: 12px;
      font-size: clamp(0.38rem, 1.4vw, 0.6rem);
    }

    .hud-item .label { color: #888; }
    .hud-item .val { color: #ff3366; }

    .canvas-wrap {
      position: relative;
      width: 100%;
      max-width: 400px;
    }

    canvas {
      display: block;
      width: 100%;
      max-width: 400px;
      height: auto;
      border: 2px solid #ff3366;
      box-shadow: 0 0 20px #ff336640, 0 0 40px #ff336620;
      background: #050505;
      image-rendering: pixelated;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }

    .overlay h2 {
      font-size: clamp(0.8rem, 3vw, 1.2rem);
      color: #ff3366;
      text-shadow: 0 0 10px #ff3366;
      text-align: center;
    }

    .overlay p {
      font-size: 0.4rem;
      color: #aaa;
      text-align: center;
      line-height: 2.2;
    }

    .btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.6rem;
      color: #0a0a0a;
      background: #ff3366;
      border: none;
      padding: 14px 28px;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .btn:hover { transform: scale(1.05); box-shadow: 0 0 20px #ff3366; }

    .hint {
      font-size: 0.38rem;
      color: #555;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <a class="back-btn" href="../index.html">&#8592; BACK</a>
  <h1>BREAKOUT</h1>

  <div class="hud">
    <div class="hud-item"><span class="label">SCORE </span><span class="val" id="score">0</span></div>
    <div class="hud-item"><span class="label">LIVES </span><span class="val" id="lives">♥ ♥ ♥</span></div>
    <div class="hud-item"><span class="label">LVL </span><span class="val" id="level">1</span></div>
  </div>

  <div class="canvas-wrap">
    <canvas id="c" width="400" height="500"></canvas>
    <div class="overlay" id="overlay">
      <h2>BREAKOUT</h2>
      <p>MOUSE or TOUCH to move paddle<br><br>BREAK ALL THE BRICKS!<br><br>3 LIVES &bull; MULTIPLE LEVELS</p>
      <button class="btn" id="startBtn">START</button>
    </div>
  </div>

  <p class="hint">MOUSE / TOUCH to move paddle</p>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const levelEl = document.getElementById('level');

    const W = canvas.width, H = canvas.height;
    const PADDLE_W = 70, PADDLE_H = 12, PADDLE_Y = H - 30;
    const BALL_R = 7;
    const BRICK_ROWS = 6, BRICK_COLS = 8;
    const BRICK_W = (W - 20) / BRICK_COLS;
    const BRICK_H = 18, BRICK_GAP = 3;
    const BRICK_TOP = 50;

    const BRICK_COLORS = [
      { color: '#ff3366', pts: 50 },
      { color: '#ff6b35', pts: 40 },
      { color: '#ffd600', pts: 30 },
      { color: '#00ff88', pts: 20 },
      { color: '#00e5ff', pts: 10 },
      { color: '#aa00ff', pts: 15 },
    ];

    let paddleX, ball, bricks, score, lives, level, baseSpeed, running, animId;
    let targetPaddleX;

    function makeBricks(lvl) {
      const b = [];
      for (let r = 0; r < BRICK_ROWS; r++) {
        for (let c = 0; c < BRICK_COLS; c++) {
          const colorInfo = BRICK_COLORS[r % BRICK_COLORS.length];
          // Higher levels: some bricks need 2 hits
          const hp = (lvl >= 3 && r < 2) ? 2 : 1;
          b.push({
            x: 10 + c * BRICK_W,
            y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
            w: BRICK_W - BRICK_GAP,
            h: BRICK_H,
            color: colorInfo.color,
            pts: colorInfo.pts,
            hp,
            maxHp: hp,
            alive: true,
          });
        }
      }
      return b;
    }

    function initBall(lvl) {
      const speed = 4 + (lvl - 1) * 0.6;
      const angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.8;
      ball = {
        x: W / 2,
        y: PADDLE_Y - 20,
        vx: speed * Math.cos(angle),
        vy: speed * Math.sin(angle),
        speed,
        onPaddle: false,
      };
    }

    function init(lvl) {
      level = lvl;
      levelEl.textContent = level;
      paddleX = W / 2;
      targetPaddleX = W / 2;
      bricks = makeBricks(level);
      initBall(level);
      ball.onPaddle = true;
    }

    function startGame() {
      score = 0; lives = 3;
      scoreEl.textContent = '0';
      livesEl.textContent = '♥ ♥ ♥';
      overlay.style.display = 'none';
      running = true;
      init(1);
      cancelAnimationFrame(animId);
      animId = requestAnimationFrame(gameLoop);
    }

    function loseLife() {
      lives--;
      const hearts = ['', '♥', '♥ ♥', '♥ ♥ ♥'];
      livesEl.textContent = hearts[lives] || '';
      if (lives <= 0) {
        endGame(false);
      } else {
        initBall(level);
        ball.onPaddle = true;
      }
    }

    function nextLevel() {
      level++;
      init(level);
    }

    function endGame(won) {
      running = false;
      cancelAnimationFrame(animId);
      overlay.innerHTML = `
        <h2 style="color:${won ? '#00ff88' : '#ff3366'}">${won ? 'YOU WIN!' : 'GAME OVER'}</h2>
        <p style="color:#00e5ff;font-size:0.6rem">SCORE: ${score}</p>
        <p>LEVEL REACHED: ${level}</p>
        <button class="btn" onclick="startGame()">PLAY AGAIN</button>
      `;
      overlay.style.display = 'flex';
    }

    function drawPaddle() {
      const px = paddleX - PADDLE_W / 2;
      ctx.fillStyle = '#ff3366';
      ctx.shadowColor = '#ff3366';
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.roundRect(px, PADDLE_Y, PADDLE_W, PADDLE_H, 5);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.fillRect(px + 4, PADDLE_Y + 2, PADDLE_W - 8, 4);
      ctx.shadowBlur = 0;
    }

    function drawBall() {
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#ff3366';
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function drawBricks() {
      bricks.forEach(b => {
        if (!b.alive) return;
        const fade = b.hp / b.maxHp;
        ctx.fillStyle = b.color;
        ctx.globalAlpha = 0.5 + 0.5 * fade;
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.roundRect(b.x, b.y, b.w, b.h, 2);
        ctx.fill();
        // Shine
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(b.x + 2, b.y + 2, b.w - 4, 4);
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
      });
    }

    function draw() {
      ctx.fillStyle = '#050505';
      ctx.fillRect(0, 0, W, H);

      // Grid
      ctx.strokeStyle = 'rgba(255,51,102,0.05)';
      ctx.lineWidth = 0.5;
      for (let i = 0; i < W; i += 20) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, H); ctx.stroke();
      }
      for (let i = 0; i < H; i += 20) {
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(W, i); ctx.stroke();
      }

      drawBricks();
      drawPaddle();
      drawBall();
    }

    function update() {
      // Smooth paddle movement
      paddleX += (targetPaddleX - paddleX) * 0.2;
      paddleX = Math.max(PADDLE_W / 2, Math.min(W - PADDLE_W / 2, paddleX));

      if (ball.onPaddle) {
        ball.x = paddleX;
        ball.y = PADDLE_Y - BALL_R - 2;
        return;
      }

      ball.x += ball.vx;
      ball.y += ball.vy;

      // Walls
      if (ball.x - BALL_R <= 0) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx); }
      if (ball.x + BALL_R >= W) { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx); }
      if (ball.y - BALL_R <= 0) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); }

      // Paddle collision
      const px = paddleX - PADDLE_W / 2;
      if (
        ball.y + BALL_R >= PADDLE_Y &&
        ball.y + BALL_R <= PADDLE_Y + PADDLE_H + 4 &&
        ball.x >= px - BALL_R &&
        ball.x <= px + PADDLE_W + BALL_R &&
        ball.vy > 0
      ) {
        const hitRatio = (ball.x - paddleX) / (PADDLE_W / 2);
        const angle = hitRatio * 1.1;
        ball.speed = Math.min(ball.speed + 0.05, 12);
        ball.vx = ball.speed * Math.sin(angle);
        ball.vy = -ball.speed * Math.cos(angle);
        ball.y = PADDLE_Y - BALL_R;
      }

      // Lost ball
      if (ball.y - BALL_R > H) {
        loseLife();
        return;
      }

      // Brick collisions
      let bricksLeft = 0;
      for (const b of bricks) {
        if (!b.alive) continue;
        bricksLeft++;
        if (
          ball.x + BALL_R > b.x &&
          ball.x - BALL_R < b.x + b.w &&
          ball.y + BALL_R > b.y &&
          ball.y - BALL_R < b.y + b.h
        ) {
          b.hp--;
          if (b.hp <= 0) {
            b.alive = false;
            bricksLeft--;
            score += b.pts;
            scoreEl.textContent = score;
          }

          // Determine which side was hit
          const fromLeft = ball.x < b.x;
          const fromRight = ball.x > b.x + b.w;
          const fromTop = ball.y < b.y;
          const fromBottom = ball.y > b.y + b.h;

          if ((fromLeft && ball.vx > 0) || (fromRight && ball.vx < 0)) {
            ball.vx *= -1;
          } else if ((fromTop && ball.vy > 0) || (fromBottom && ball.vy < 0)) {
            ball.vy *= -1;
          } else {
            ball.vy *= -1;
          }
          break;
        }
      }

      if (bricksLeft === 0) {
        nextLevel();
      }
    }

    function gameLoop() {
      if (!running) return;
      update();
      draw();
      animId = requestAnimationFrame(gameLoop);
    }

    document.getElementById('startBtn').addEventListener('click', startGame);

    // Controls
    function setPaddleTarget(clientX) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = W / rect.width;
      targetPaddleX = (clientX - rect.left) * scaleX;
    }

    canvas.addEventListener('mousemove', e => setPaddleTarget(e.clientX));

    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      setPaddleTarget(e.touches[0].clientX);
    }, { passive: false });

    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      setPaddleTarget(e.touches[0].clientX);
      if (ball && ball.onPaddle) ball.onPaddle = false;
    }, { passive: false });

    canvas.addEventListener('click', () => {
      if (ball && ball.onPaddle) ball.onPaddle = false;
    });

    // Draw initial frame
    ctx.fillStyle = '#050505';
    ctx.fillRect(0, 0, W, H);
  </script>
</body>
</html>
