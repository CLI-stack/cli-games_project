<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TETRIS</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 20px;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.15) 2px,rgba(0,0,0,0.15) 4px);
      pointer-events: none;
      z-index: 100;
    }

    .back-btn {
      position: fixed;
      top: 12px;
      left: 12px;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.5rem;
      color: #00e5ff;
      text-decoration: none;
      background: rgba(0,229,255,0.1);
      border: 1px solid #00e5ff;
      padding: 8px 12px;
      border-radius: 4px;
      z-index: 200;
    }
    .back-btn:hover { background: rgba(0,229,255,0.25); }

    h1 {
      font-size: clamp(1rem, 4vw, 1.6rem);
      color: #00e5ff;
      text-shadow: 0 0 10px #00e5ff, 0 0 20px #00e5ff;
      margin: 70px 0 16px;
      letter-spacing: 0.2em;
    }

    .game-area {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      width: 100%;
      max-width: 480px;
      padding: 0 8px;
    }

    .board-wrap {
      position: relative;
      flex-shrink: 0;
    }

    canvas#board {
      display: block;
      border: 2px solid #00e5ff;
      box-shadow: 0 0 20px #00e5ff40, 0 0 40px #00e5ff20;
      background: #050505;
      image-rendering: pixelated;
      width: 200px;
      height: 400px;
    }

    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 110px;
    }

    .panel-box {
      background: rgba(255,255,255,0.04);
      border: 1px solid #00e5ff44;
      border-radius: 6px;
      padding: 10px;
    }

    .panel-label {
      font-size: 0.4rem;
      color: #aaa;
      margin-bottom: 8px;
      letter-spacing: 0.15em;
    }

    .panel-value {
      font-size: clamp(0.55rem, 2vw, 0.75rem);
      color: #00e5ff;
    }

    canvas#next {
      display: block;
      margin-top: 6px;
      background: transparent;
      image-rendering: pixelated;
      width: 80px;
      height: 80px;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 16px;
    }

    .overlay h2 {
      font-size: clamp(0.7rem, 2.5vw, 1rem);
      color: #00e5ff;
      text-shadow: 0 0 10px #00e5ff;
      text-align: center;
    }

    .overlay p {
      font-size: 0.4rem;
      color: #aaa;
      text-align: center;
      line-height: 2;
    }

    .btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.55rem;
      color: #0a0a0a;
      background: #00e5ff;
      border: none;
      padding: 12px 20px;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .btn:hover { transform: scale(1.05); box-shadow: 0 0 20px #00e5ff; }

    /* Mobile controls */
    .mobile-controls {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(5, 56px);
      gap: 6px;
      justify-content: center;
    }

    .ctrl-btn {
      width: 56px;
      height: 56px;
      background: rgba(255,255,255,0.07);
      border: 2px solid #00e5ff88;
      border-radius: 6px;
      color: #00e5ff;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      transition: background 0.1s;
    }
    .ctrl-btn:active, .ctrl-btn.pressed {
      background: rgba(0,229,255,0.25);
    }

    .ctrl-btn.wide {
      grid-column: span 2;
      width: 100%;
    }

    .ctrl-row {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <a class="back-btn" href="../index.html">&#8592; BACK</a>
  <h1>TETRIS</h1>

  <div class="game-area">
    <div class="board-wrap">
      <canvas id="board" width="200" height="400"></canvas>
      <div class="overlay" id="overlay">
        <h2>TETRIS</h2>
        <p>← → MOVE &nbsp; ↑ ROTATE<br>↓ SOFT DROP &nbsp; SPACE DROP<br><br>CLEAR LINES TO SCORE!</p>
        <button class="btn" id="startBtn">START</button>
      </div>
    </div>

    <div class="side-panel">
      <div class="panel-box">
        <div class="panel-label">SCORE</div>
        <div class="panel-value" id="score">0</div>
      </div>
      <div class="panel-box">
        <div class="panel-label">LINES</div>
        <div class="panel-value" id="lines">0</div>
      </div>
      <div class="panel-box">
        <div class="panel-label">LEVEL</div>
        <div class="panel-value" id="level">1</div>
      </div>
      <div class="panel-box">
        <div class="panel-label">NEXT</div>
        <canvas id="next" width="80" height="80"></canvas>
      </div>
    </div>
  </div>

  <!-- Mobile controls -->
  <div class="mobile-controls" id="mobileCtrl">
    <div class="ctrl-btn" id="btnLeft">◀</div>
    <div class="ctrl-btn" id="btnDown">▼</div>
    <div class="ctrl-btn" id="btnRotate">↻</div>
    <div class="ctrl-btn" id="btnRight">▶</div>
    <div class="ctrl-btn" id="btnDrop">⬇</div>
  </div>

  <script>
    const board = document.getElementById('board');
    const bctx = board.getContext('2d');
    const nextC = document.getElementById('next');
    const nctx = nextC.getContext('2d');
    const overlay = document.getElementById('overlay');
    const scoreEl = document.getElementById('score');
    const linesEl = document.getElementById('lines');
    const levelEl = document.getElementById('level');

    const COLS = 10, ROWS = 20;
    const CELL = board.width / COLS; // 20px

    // Tetromino shapes
    const SHAPES = {
      I: { cells: [[0,1],[1,1],[2,1],[3,1]], color: '#00e5ff' },
      O: { cells: [[0,0],[1,0],[0,1],[1,1]], color: '#ffd600' },
      T: { cells: [[1,0],[0,1],[1,1],[2,1]], color: '#aa00ff' },
      S: { cells: [[1,0],[2,0],[0,1],[1,1]], color: '#00ff88' },
      Z: { cells: [[0,0],[1,0],[1,1],[2,1]], color: '#ff3366' },
      J: { cells: [[0,0],[0,1],[1,1],[2,1]], color: '#0040ff' },
      L: { cells: [[2,0],[0,1],[1,1],[2,1]], color: '#ff6b35' },
    };
    const SHAPE_KEYS = Object.keys(SHAPES);

    const SCORES = [0, 100, 300, 500, 800];

    let grid, piece, nextPiece, score, lines, level, speed, dropTimer, running, animId;

    function makeGrid() {
      return Array.from({ length: ROWS }, () => new Array(COLS).fill(null));
    }

    function randomPiece() {
      const key = SHAPE_KEYS[Math.floor(Math.random() * SHAPE_KEYS.length)];
      const s = SHAPES[key];
      return {
        cells: s.cells.map(c => [...c]),
        color: s.color,
        x: Math.floor(COLS / 2) - 1,
        y: 0,
      };
    }

    function rotate(piece) {
      // Get bounding box
      const xs = piece.cells.map(c => c[0]);
      const ys = piece.cells.map(c => c[1]);
      const maxX = Math.max(...xs);
      return {
        ...piece,
        cells: piece.cells.map(([x, y]) => [maxX - y, x]),
      };
    }

    function getAbsCells(p) {
      return p.cells.map(([cx, cy]) => [cx + p.x, cy + p.y]);
    }

    function isValid(p, g) {
      return getAbsCells(p).every(([x, y]) =>
        x >= 0 && x < COLS && y < ROWS && (y < 0 || g[y][x] === null)
      );
    }

    function lockPiece() {
      getAbsCells(piece).forEach(([x, y]) => {
        if (y >= 0) grid[y][x] = piece.color;
      });

      // Clear lines
      let cleared = 0;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (grid[r].every(c => c !== null)) {
          grid.splice(r, 1);
          grid.unshift(new Array(COLS).fill(null));
          cleared++;
          r++; // recheck same row
        }
      }

      if (cleared > 0) {
        score += SCORES[cleared] * level;
        lines += cleared;
        scoreEl.textContent = score;
        linesEl.textContent = lines;
        const newLevel = Math.floor(lines / 10) + 1;
        if (newLevel !== level) {
          level = newLevel;
          levelEl.textContent = level;
          speed = Math.max(100, 800 - (level - 1) * 70);
        }
      }

      piece = nextPiece;
      nextPiece = randomPiece();
      drawNext();

      if (!isValid(piece, grid)) {
        endGame();
      }
    }

    function drop() {
      const moved = { ...piece, y: piece.y + 1 };
      if (isValid(moved, grid)) {
        piece = moved;
      } else {
        lockPiece();
      }
    }

    function hardDrop() {
      while (true) {
        const moved = { ...piece, y: piece.y + 1 };
        if (isValid(moved, grid)) {
          piece = moved;
        } else {
          lockPiece();
          break;
        }
      }
    }

    function drawCell(ctx, x, y, color, cellSize) {
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 6;
      ctx.fillRect(x * cellSize + 1, y * cellSize + 1, cellSize - 2, cellSize - 2);
      // Shine
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.fillRect(x * cellSize + 2, y * cellSize + 2, cellSize - 4, 3);
      ctx.shadowBlur = 0;
    }

    function drawBoard() {
      bctx.fillStyle = '#050505';
      bctx.fillRect(0, 0, board.width, board.height);

      // Grid lines
      bctx.strokeStyle = 'rgba(255,255,255,0.04)';
      bctx.lineWidth = 0.5;
      for (let r = 0; r < ROWS; r++) {
        bctx.beginPath(); bctx.moveTo(0, r * CELL); bctx.lineTo(board.width, r * CELL); bctx.stroke();
      }
      for (let c = 0; c < COLS; c++) {
        bctx.beginPath(); bctx.moveTo(c * CELL, 0); bctx.lineTo(c * CELL, board.height); bctx.stroke();
      }

      // Locked pieces
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[r][c]) drawCell(bctx, c, r, grid[r][c], CELL);
        }
      }

      // Ghost piece
      let ghost = { ...piece };
      while (isValid({ ...ghost, y: ghost.y + 1 }, grid)) ghost.y++;
      if (ghost.y !== piece.y) {
        getAbsCells(ghost).forEach(([x, y]) => {
          if (y >= 0) {
            bctx.fillStyle = piece.color + '33';
            bctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
            bctx.strokeStyle = piece.color + '66';
            bctx.lineWidth = 1;
            bctx.strokeRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
          }
        });
      }

      // Active piece
      getAbsCells(piece).forEach(([x, y]) => {
        if (y >= 0) drawCell(bctx, x, y, piece.color, CELL);
      });
    }

    function drawNext() {
      nctx.clearRect(0, 0, nextC.width, nextC.height);
      const NCELL = 16;
      const cells = nextPiece.cells;
      const xs = cells.map(c => c[0]);
      const ys = cells.map(c => c[1]);
      const w = Math.max(...xs) - Math.min(...xs) + 1;
      const h = Math.max(...ys) - Math.min(...ys) + 1;
      const ox = Math.floor((5 - w) / 2) - Math.min(...xs);
      const oy = Math.floor((5 - h) / 2) - Math.min(...ys);

      cells.forEach(([cx, cy]) => {
        drawCell(nctx, cx + ox, cy + oy, nextPiece.color, NCELL);
      });
    }

    let lastTime = 0;
    let dropAccum = 0;

    function gameLoop(time) {
      if (!running) return;
      const dt = time - lastTime;
      lastTime = time;
      dropAccum += dt;
      if (dropAccum >= speed) {
        drop();
        dropAccum = 0;
      }
      drawBoard();
      animId = requestAnimationFrame(gameLoop);
    }

    function startGame() {
      grid = makeGrid();
      score = 0; lines = 0; level = 1; speed = 800;
      scoreEl.textContent = '0';
      linesEl.textContent = '0';
      levelEl.textContent = '1';
      piece = randomPiece();
      nextPiece = randomPiece();
      drawNext();
      overlay.style.display = 'none';
      running = true;
      lastTime = 0;
      dropAccum = 0;
      cancelAnimationFrame(animId);
      animId = requestAnimationFrame(gameLoop);
    }

    function endGame() {
      running = false;
      cancelAnimationFrame(animId);
      overlay.innerHTML = `
        <h2>GAME OVER</h2>
        <p style="color:#00e5ff;font-size:0.6rem">SCORE<br><br>${score}</p>
        <p>LINES: ${lines} &nbsp; LEVEL: ${level}</p>
        <button class="btn" onclick="startGame()">RETRY</button>
      `;
      overlay.style.display = 'flex';
    }

    document.getElementById('startBtn').addEventListener('click', startGame);

    // Keyboard
    document.addEventListener('keydown', e => {
      if (!running) return;
      switch (e.key) {
        case 'ArrowLeft': {
          e.preventDefault();
          const m = { ...piece, x: piece.x - 1 };
          if (isValid(m, grid)) piece = m;
          break;
        }
        case 'ArrowRight': {
          e.preventDefault();
          const m = { ...piece, x: piece.x + 1 };
          if (isValid(m, grid)) piece = m;
          break;
        }
        case 'ArrowDown': {
          e.preventDefault();
          drop();
          dropAccum = 0;
          break;
        }
        case 'ArrowUp': {
          e.preventDefault();
          const r = rotate(piece);
          if (isValid(r, grid)) piece = r;
          else {
            // Wall kick
            const kicks = [1, -1, 2, -2];
            for (const k of kicks) {
              const kr = { ...r, x: r.x + k };
              if (isValid(kr, grid)) { piece = kr; break; }
            }
          }
          break;
        }
        case ' ': {
          e.preventDefault();
          hardDrop();
          dropAccum = 0;
          break;
        }
      }
    });

    // Mobile buttons
    function makeCtrlBtn(id, fn) {
      const btn = document.getElementById(id);
      let interval = null;
      function press() { if (running) fn(); }
      function startRepeat() {
        press();
        interval = setInterval(() => { if (running) fn(); }, 120);
      }
      function stopRepeat() { clearInterval(interval); interval = null; }
      btn.addEventListener('touchstart', e => { e.preventDefault(); startRepeat(); btn.classList.add('pressed'); }, { passive: false });
      btn.addEventListener('touchend', () => { stopRepeat(); btn.classList.remove('pressed'); });
      btn.addEventListener('mousedown', startRepeat);
      btn.addEventListener('mouseup', stopRepeat);
      btn.addEventListener('mouseleave', stopRepeat);
    }

    makeCtrlBtn('btnLeft', () => { const m = { ...piece, x: piece.x - 1 }; if (isValid(m, grid)) piece = m; });
    makeCtrlBtn('btnRight', () => { const m = { ...piece, x: piece.x + 1 }; if (isValid(m, grid)) piece = m; });
    makeCtrlBtn('btnDown', () => { drop(); dropAccum = 0; });

    document.getElementById('btnRotate').addEventListener('touchstart', e => {
      e.preventDefault();
      if (!running) return;
      const r = rotate(piece);
      if (isValid(r, grid)) piece = r;
      else {
        const kicks = [1, -1, 2, -2];
        for (const k of kicks) {
          const kr = { ...r, x: r.x + k };
          if (isValid(kr, grid)) { piece = kr; break; }
        }
      }
    }, { passive: false });
    document.getElementById('btnRotate').addEventListener('mousedown', () => {
      if (!running) return;
      const r = rotate(piece);
      if (isValid(r, grid)) piece = r;
    });

    document.getElementById('btnDrop').addEventListener('touchstart', e => {
      e.preventDefault();
      if (!running) return;
      hardDrop();
      dropAccum = 0;
    }, { passive: false });
    document.getElementById('btnDrop').addEventListener('mousedown', () => {
      if (!running) return;
      hardDrop();
      dropAccum = 0;
    });
  </script>
</body>
</html>
