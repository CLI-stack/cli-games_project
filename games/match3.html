<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Match 3</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0a;
    color: #fff;
    font-family: 'Press Start 2P', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 10px;
    overflow-x: hidden;
    touch-action: none;
  }
  #back-btn {
    position: fixed;
    top: 10px;
    left: 10px;
    color: #ff6b35;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    text-decoration: none;
    z-index: 100;
    background: rgba(10,10,10,0.8);
    padding: 6px 8px;
    border: 1px solid #ff6b35;
  }
  h1 {
    font-size: clamp(11px, 3.2vw, 18px);
    color: #ff3366;
    margin: 50px 0 10px;
    text-shadow: 0 0 10px #ff3366;
    letter-spacing: 2px;
  }
  #hud {
    display: flex;
    gap: 20px;
    margin-bottom: 10px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
  }
  .hud-item { text-align: center; }
  .hud-label { font-size: clamp(7px, 1.7vw, 9px); color: #888; }
  .hud-val   { font-size: clamp(10px, 2.5vw, 14px); color: #ff6b35; margin-top: 3px; }
  #message {
    font-size: clamp(9px, 2.2vw, 12px);
    min-height: 24px;
    color: #00ff88;
    text-align: center;
    margin-bottom: 8px;
  }
  #board-container {
    position: relative;
    margin-bottom: 12px;
    touch-action: none;
  }
  #board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 3px;
    background: #111;
    padding: 6px;
    border: 2px solid #ff336688;
    box-shadow: 0 0 20px #ff336633;
    touch-action: none;
  }
  .gem {
    width: clamp(36px, 10.5vw, 54px);
    height: clamp(36px, 10.5vw, 54px);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(18px, 5vw, 28px);
    cursor: pointer;
    position: relative;
    transition: transform 0.12s ease;
    border: 2px solid transparent;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    touch-action: none;
  }
  .gem:active { transform: scale(0.9); }
  .gem.selected {
    border-color: #fff;
    box-shadow: 0 0 12px rgba(255,255,255,0.8);
    transform: scale(1.08);
    z-index: 2;
  }
  .gem.matched {
    animation: pop-out 0.3s ease forwards;
  }
  .gem.falling {
    animation: fall-in 0.2s ease;
  }
  .gem.wrong-swap {
    animation: wrong 0.35s ease;
  }
  @keyframes pop-out {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.3); opacity: 0.6; }
    100% { transform: scale(0); opacity: 0; }
  }
  @keyframes fall-in {
    0% { transform: translateY(-40px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }
  @keyframes wrong {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  #new-btn {
    background: transparent;
    border: 2px solid #00e5ff;
    color: #00e5ff;
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(9px, 2.5vw, 12px);
    padding: 10px 18px;
    cursor: pointer;
    margin-bottom: 20px;
    -webkit-tap-highlight-color: transparent;
  }
  #new-btn:active { background: #00e5ff22; }
  .score-pop {
    position: fixed;
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    color: #ff6b35;
    pointer-events: none;
    z-index: 999;
    animation: score-fly 0.8s ease forwards;
  }
  @keyframes score-fly {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-60px) scale(1.4); }
  }
</style>
</head>
<body>
<a href="../index.html" id="back-btn">&#8592; BACK</a>
<h1>GEM MATCH</h1>
<div id="hud">
  <div class="hud-item"><div class="hud-label">SCORE</div><div class="hud-val" id="score">0</div></div>
  <div class="hud-item"><div class="hud-label">BEST</div><div class="hud-val" id="best">0</div></div>
  <div class="hud-item"><div class="hud-label">MOVES</div><div class="hud-val" id="moves">0</div></div>
  <div class="hud-item"><div class="hud-label">CHAIN</div><div class="hud-val" id="chain">x1</div></div>
</div>
<div id="message"></div>
<div id="board-container">
  <div id="board"></div>
</div>
<button id="new-btn">NEW GAME</button>

<script>
const GEMS = ['💎','🔥','💚','⭐','💜','🔵','🟠'];
// Colors corresponding to gem types for bg
const GEM_BG = ['#001433','#330800','#003310','#332b00','#1a0033','#001833','#332000'];
const GEM_BORDER = ['#00e5ff','#ff3366','#00ff88','#ff6b35','#cc44ff','#44aaff','#ffaa00'];

const COLS = 8;
const ROWS = 8;
const NUM_GEMS = 5; // use first 5 gem types

let grid = [];         // ROWS*COLS array of gem indices (0-4) or -1 for empty
let selectedCell = -1;
let score = 0;
let best = 0;
let moveCount = 0;
let chainMultiplier = 1;
let busy = false;     // block input during animations

const boardEl = document.getElementById('board');
const scoreEl = document.getElementById('score');
const bestEl  = document.getElementById('best');
const movesEl = document.getElementById('moves');
const chainEl = document.getElementById('chain');
const msgEl   = document.getElementById('message');

// Touch state
let touchStartCell = -1;
let touchStartX = 0;
let touchStartY = 0;

function idx(r, c) { return r * COLS + c; }
function row(i)    { return Math.floor(i / COLS); }
function col(i)    { return i % COLS; }

function randomGem() { return Math.floor(Math.random() * NUM_GEMS); }

function initGrid() {
  do {
    grid = Array.from({length: ROWS * COLS}, randomGem);
  } while (findAllMatches().length > 0 || !hasValidMoves());
}

function renderBoard() {
  boardEl.innerHTML = '';
  for (let i = 0; i < ROWS * COLS; i++) {
    const gem = createGemEl(i);
    boardEl.appendChild(gem);
  }
}

function createGemEl(i) {
  const div = document.createElement('div');
  div.className = 'gem';
  div.dataset.idx = i;
  const g = grid[i];
  if (g >= 0) {
    div.textContent = GEMS[g];
    div.style.background = GEM_BG[g];
    div.style.borderColor = selectedCell === i ? '#fff' : GEM_BORDER[g] + '66';
    if (selectedCell === i) {
      div.classList.add('selected');
      div.style.borderColor = '#fff';
    }
  }
  div.addEventListener('click', () => handleCellClick(i));
  div.addEventListener('touchstart', e => {
    touchStartCell = i;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  div.addEventListener('touchend', e => {
    if (touchStartCell !== i) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < 12) {
      handleCellClick(i);
    } else {
      // Swipe direction
      const r = row(i), c = col(i);
      let target = -1;
      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 0 && c < COLS-1) target = idx(r, c+1);
        else if (dx < 0 && c > 0) target = idx(r, c-1);
      } else {
        if (dy > 0 && r < ROWS-1) target = idx(r+1, c);
        else if (dy < 0 && r > 0) target = idx(r-1, c);
      }
      if (target >= 0) {
        selectedCell = i;
        handleCellClick(target);
      }
    }
    touchStartCell = -1;
  }, { passive: true });
  return div;
}

function updateGemEl(i) {
  const existing = boardEl.children[i];
  if (!existing) return;
  const g = grid[i];
  existing.textContent = g >= 0 ? GEMS[g] : '';
  existing.style.background = g >= 0 ? GEM_BG[g] : 'transparent';
  existing.style.borderColor = selectedCell === i ? '#fff' : (g >= 0 ? GEM_BORDER[g]+'66' : 'transparent');
  existing.classList.toggle('selected', selectedCell === i);
}

function handleCellClick(i) {
  if (busy) return;
  if (grid[i] < 0) return;

  if (selectedCell < 0) {
    selectedCell = i;
    updateGemEl(i);
    return;
  }
  if (selectedCell === i) {
    selectedCell = -1;
    updateGemEl(i);
    return;
  }

  // Check adjacency
  const r1 = row(selectedCell), c1 = col(selectedCell);
  const r2 = row(i), c2 = col(i);
  const adjacent = (Math.abs(r1-r2) + Math.abs(c1-c2)) === 1;

  if (!adjacent) {
    const prev = selectedCell;
    selectedCell = i;
    updateGemEl(prev);
    updateGemEl(i);
    return;
  }

  // Attempt swap
  const from = selectedCell;
  selectedCell = -1;
  attemptSwap(from, i);
}

async function attemptSwap(a, b) {
  busy = true;
  swapCells(a, b);
  updateGemEl(a);
  updateGemEl(b);

  await delay(150);

  const matches = findAllMatches();
  if (matches.length === 0) {
    // Invalid swap — revert
    swapCells(a, b);
    updateGemEl(a);
    updateGemEl(b);
    // Shake animation
    boardEl.children[a].classList.add('wrong-swap');
    boardEl.children[b].classList.add('wrong-swap');
    await delay(350);
    boardEl.children[a].classList.remove('wrong-swap');
    boardEl.children[b].classList.remove('wrong-swap');
    busy = false;
    return;
  }

  moveCount++;
  movesEl.textContent = moveCount;
  chainMultiplier = 1;
  chainEl.textContent = 'x1';

  await processMatches(matches);
  busy = false;
}

async function processMatches(matches) {
  if (matches.length === 0) {
    chainMultiplier = 1;
    chainEl.textContent = 'x1';
    if (!hasValidMoves()) {
      await delay(400);
      msgEl.textContent = 'NO MOVES! SHUFFLING...';
      await delay(800);
      shuffleBoard();
      msgEl.textContent = '';
    }
    return;
  }

  // Animate matched gems out
  const matchSet = new Set(matches);
  matchSet.forEach(i => {
    boardEl.children[i].classList.add('matched');
  });

  // Score
  const matchCount = matchSet.size;
  const pts = matchCount * 10 * chainMultiplier;
  score += pts;
  if (score > best) { best = score; bestEl.textContent = best; }
  scoreEl.textContent = score;
  chainEl.textContent = `x${chainMultiplier}`;

  // Show score popup
  showScorePop(`+${pts}`);

  await delay(320);

  // Remove matched gems
  matchSet.forEach(i => { grid[i] = -1; });
  matchSet.forEach(i => {
    boardEl.children[i].classList.remove('matched');
    updateGemEl(i);
  });

  // Drop gems down
  await dropGems();

  // Fill new gems from top
  await fillGems();

  // Chain reaction
  chainMultiplier = Math.min(chainMultiplier + 1, 8);
  chainEl.textContent = `x${chainMultiplier}`;

  const newMatches = findAllMatches();
  if (newMatches.length > 0) {
    await delay(200);
    await processMatches(newMatches);
  } else {
    chainMultiplier = 1;
    chainEl.textContent = 'x1';
    if (!hasValidMoves()) {
      await delay(400);
      msgEl.textContent = 'NO MOVES! SHUFFLING...';
      await delay(800);
      shuffleBoard();
      msgEl.textContent = '';
    }
  }
}

async function dropGems() {
  // For each column, drop gems down to fill empty spaces
  let moved = false;
  for (let c = 0; c < COLS; c++) {
    let writeRow = ROWS - 1;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (grid[idx(r, c)] >= 0) {
        if (writeRow !== r) {
          grid[idx(writeRow, c)] = grid[idx(r, c)];
          grid[idx(r, c)] = -1;
          moved = true;
        }
        writeRow--;
      }
    }
  }
  if (moved) {
    renderBoard();
    // Add falling animation to non-empty cells
    for (let i = 0; i < ROWS * COLS; i++) {
      if (grid[i] >= 0) boardEl.children[i].classList.add('falling');
    }
    await delay(220);
    for (let i = 0; i < ROWS * COLS; i++) {
      boardEl.children[i].classList.remove('falling');
    }
  }
}

async function fillGems() {
  let filled = false;
  for (let i = 0; i < ROWS * COLS; i++) {
    if (grid[i] < 0) {
      grid[i] = randomGem();
      filled = true;
    }
  }
  if (filled) {
    renderBoard();
    for (let i = 0; i < ROWS * COLS; i++) {
      if (grid[i] >= 0) boardEl.children[i].classList.add('falling');
    }
    await delay(220);
    for (let i = 0; i < ROWS * COLS; i++) {
      boardEl.children[i].classList.remove('falling');
    }
  }
}

function findAllMatches() {
  const matched = new Set();

  // Horizontal
  for (let r = 0; r < ROWS; r++) {
    let run = 1;
    for (let c = 1; c < COLS; c++) {
      const cur = grid[idx(r, c)];
      const prev = grid[idx(r, c-1)];
      if (cur >= 0 && cur === prev) {
        run++;
      } else {
        if (run >= 3) {
          for (let k = c-run; k < c; k++) matched.add(idx(r, k));
        }
        run = 1;
      }
    }
    if (run >= 3) {
      for (let k = COLS-run; k < COLS; k++) matched.add(idx(r, k));
    }
  }

  // Vertical
  for (let c = 0; c < COLS; c++) {
    let run = 1;
    for (let r = 1; r < ROWS; r++) {
      const cur = grid[idx(r, c)];
      const prev = grid[idx(r-1, c)];
      if (cur >= 0 && cur === prev) {
        run++;
      } else {
        if (run >= 3) {
          for (let k = r-run; k < r; k++) matched.add(idx(k, c));
        }
        run = 1;
      }
    }
    if (run >= 3) {
      for (let k = ROWS-run; k < ROWS; k++) matched.add(idx(k, c));
    }
  }

  return [...matched];
}

function swapCells(a, b) {
  const tmp = grid[a];
  grid[a] = grid[b];
  grid[b] = tmp;
}

function hasValidMoves() {
  // Check if any swap produces a match
  for (let i = 0; i < ROWS * COLS; i++) {
    const r = row(i), c = col(i);
    // Try swap right
    if (c < COLS - 1) {
      swapCells(i, idx(r, c+1));
      const m = findAllMatches().length > 0;
      swapCells(i, idx(r, c+1));
      if (m) return true;
    }
    // Try swap down
    if (r < ROWS - 1) {
      swapCells(i, idx(r+1, c));
      const m = findAllMatches().length > 0;
      swapCells(i, idx(r+1, c));
      if (m) return true;
    }
  }
  return false;
}

function shuffleBoard() {
  let attempts = 0;
  do {
    for (let i = 0; i < ROWS * COLS; i++) {
      const j = Math.floor(Math.random() * ROWS * COLS);
      swapCells(i, j);
    }
    attempts++;
  } while ((findAllMatches().length > 0 || !hasValidMoves()) && attempts < 50);
  renderBoard();
}

function showScorePop(text) {
  const el = document.createElement('div');
  el.className = 'score-pop';
  el.textContent = text;
  // Position near board center
  const rect = boardEl.getBoundingClientRect();
  el.style.left = (rect.left + rect.width/2 - 30) + 'px';
  el.style.top  = (rect.top  + rect.height/2) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 800);
}

function delay(ms) {
  return new Promise(r => setTimeout(r, ms));
}

function newGame() {
  busy = false;
  selectedCell = -1;
  score = 0;
  moveCount = 0;
  chainMultiplier = 1;
  scoreEl.textContent = '0';
  movesEl.textContent = '0';
  chainEl.textContent = 'x1';
  msgEl.textContent = '';
  initGrid();
  renderBoard();
}

document.getElementById('new-btn').addEventListener('click', newGame);

newGame();
</script>
</body>
</html>
